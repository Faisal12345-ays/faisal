{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaCart | Premium Store</title>

    <!-- 🔥 Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/bill_logo.png' %}">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { 
            --p-gold: #eab308; 
            --p-blue: #0ea5e9; 
            --p-orange: #f85606; 
        }

        body { 
            background-color: #000000 !important; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #ffffff; 
            margin: 0; 
        }

        /* 🔥 WELCOME BAR */
        .top-welcome-bar {
            background-color: #131921;
            text-align: center;
            padding: 8px 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }

        .top-welcome-bar b {
            color: var(--p-gold);
        }

        /* 🔥 NAVBAR */
        .navbar-main { 
            background: #131921; 
            padding: 15px 0; 
            border-bottom: 1px solid #333; 
            position: sticky; 
            top: 0; 
            z-index: 1050; 
        }

        .nav-logo-img { 
            height: 35px; 
            margin-right: 12px; 
        }

        .brand-name { 
            font-size: 24px; 
            font-weight: 800; 
            color: #fff; 
        }

        .brand-name span { 
            color: var(--p-orange); 
        }

        /* 🔥 SEARCH */
        .nav-search-container { 
            background: #f1f4f9; 
            border-radius: 8px; 
            padding: 5px 15px; 
            display: flex; 
            align-items: center; 
            width: 100%; 
        }

        .nav-search { 
            border: none; 
            background: transparent; 
            width: 100%; 
            outline: none; 
            font-size: 14px; 
            padding: 5px 10px; 
            color: #000; 
        }

        /* 🔥 MAIN WRAPPER (UPDATED) */
        .main-wrapper { 
            margin-top: 90px; 
            padding: 20px; 
            width: 100%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
</head>

<body>

<!-- 🔥 WELCOME -->
<div class="top-welcome-bar">
    WELCOME TO <b>INSTACART</b> OFFICIAL ONLINE STORE
</div>

<!-- 🔥 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-main shadow-lg">
    <div class="container">

        <!-- LOGO -->
        <a class="d-flex align-items-center text-decoration-none me-4" href="/">
            <img src="{% static 'images/bill_logo.png' %}" class="nav-logo-img">
            <div class="brand-name">Insta<span>Cart</span></div>
        </a>

        <!-- SEARCH -->
        <div class="flex-grow-1 mx-lg-5">
            <form action="{% url 'product_list' %}" method="GET" class="nav-search-container">
                <input class="nav-search" type="search" name="q"
                       placeholder="Search premium items..."
                       value="{{ request.GET.q }}">
                <button type="submit" style="background:none; border:none;">
                    <i class="fas fa-search text-info"></i>
                </button>
            </form>
        </div>

        <!-- RIGHT SIDE -->
        <div class="d-flex align-items-center gap-4">
            <span class="small text-white">
                Hi, <b>{{ user.username|default:"Guest" }}</b>
            </span>

            <a href="{% url 'cart_detail' %}" class="text-white position-relative">
                <i class="fas fa-shopping-basket fa-lg text-warning"></i>
                <span class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" style="font-size: 10px;">
                    {% if request.session.cart %}
                        {{ request.session.cart|length }}
                    {% else %}
                        0
                    {% endif %}
                </span>
            </a>
        </div>

    </div>
</nav>

<!-- 🔥 CONTENT -->
<div class="main-wrapper">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
