{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center py-5">
    <div class="col-md-5 bg-white p-4 shadow-sm rounded-3 border">

        <!-- Progress Bar -->
        <div class="d-flex justify-content-between mb-4 small fw-bold text-muted px-2">
            <span class="text-success">
                <i class="fas fa-check-circle"></i> Address
            </span>
            <span class="text-orange">
                <i class="fas fa-dot-circle"></i> Payment
            </span>
            <span>
                <i class="far fa-circle"></i> Review
            </span>
        </div>

        <h4 class="fw-bold mb-4">Select a payment method</h4>
        
        <!-- 🔥 UPDATED FORM -->
        <form method="POST" action="{% url 'checkout' %}">
            {% csrf_token %}

            <!-- COD OPTION -->
            <div class="card p-3 mb-3 border-warning bg-light">
                <div class="form-check">
                    <input class="form-check-input" 
                           type="radio" 
                           name="payment" 
                           id="cod" 
                           value="cod" 
                           checked>

                    <label class="form-check-label fw-bold" for="cod">
                        Cash on Delivery (COD)
                    </label>

                    <p class="small text-muted mb-0">
                        Pay when you receive your order.
                    </p>
                </div>
            </div>
            
            <!-- SUBMIT BUTTON -->
            <button type="submit" 
                    class="btn btn-warning w-100 fw-bold py-2 mt-3 shadow-sm" 
                    style="background:#ffa41c">
                Continue to Review Order
            </button>

        </form>

    </div>
</div>

{% endblock %}
