{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center py-5">
    <div class="col-md-6">

        <!-- Progress Indicator (Amazon Style) -->
        <div class="d-flex justify-content-between mb-4 small fw-bold text-muted px-2">

            <span>2. Payment</span>

            <!-- 🔥 FIX: Action ko khali chhor dein taake ye views.py ke checkout_details function mein jaye -->
            <form method="POST" action=""> <!-- Action khali rakhein -->
    {% csrf_token %}
    <input type="text" name="name" ... required> <!-- name="name" hona chahiye -->

    <textarea name="address" ... required></textarea> <!-- name="address" hona chahiye -->

</form>
            </form>

    </div>
</div>

<style>
.text-orange { color: #f85606; }

    background: #ffa41c;
    border: 1px solid #ff8f00;

}
