{% extends 'base.html' %}

{% block content %}

<div class="products">

    {% for product in products %}
        <div class="card">

            <!-- 👇 Image add ki -->
            <img src="{{ product.image.url }}" alt="{{ product.name }}">

            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }}</p>

            <button>Add to Cart</button>

        </div>
    {% endfor %}

</div>

{% endblock %}
